<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Page Tabs</title>
  <style>
    /* Container layout */
    .tab-container {
      max-width: 600px;
      margin: 50px auto;
      font-family: Arial, sans-serif;
    }

    /* Tab navigation bar */
    .tab-menu {
      display: flex;
      border-bottom: 2px solid #ccc;
    }

    /* Individual tab buttons */
    .tab-btn {
      padding: 10px 20px;
      cursor: pointer;
      background: #f1f1f1;
      border: 1px solid #ccc;
      border-bottom: none;
      margin-right: 5px;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      font-size: 16px;
      transition: background 0.3s;
    }

    /* Hover effect */
    .tab-btn:hover {
      background: #ddd;
    }

    /* Active tab style */
    .tab-btn.active {
      background: #fff;
      border-bottom: 2px solid #fff;
      margin-bottom: -2px; /* Covers the container border */
      font-weight: bold;
    }

    /* Content panels */
    .tab-panel {
      display: none; /* Hidden by default */
      padding: 20px;
      border: 1px solid #ccc;
      border-top: none;
    }

    /* Active content panel */
    .tab-panel.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="tab-container">
    <!-- Tab Navigation Headers -->
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab(event, 'tab-home')">Home</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-profile')">Profile</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab-settings')">Settings</button>
    </div>

    <!-- Tab Content Panels -->
    <div id="tab-home" class="tab-panel active">
      <h3>Home Panel</h3>
      <p>Welcome to the home page tab content.</p>
    </div>

    <div id="tab-profile" class="tab-panel">
      <h3>Profile Panel</h3>
      <p>Manage your profile settings and information here.</p>
    </div>

    <div id="tab-settings" class="tab-panel">
      <h3>Settings Panel</h3>
      <p>Customize your account features and configurations.</p>
    </div>
  </div>

  <script>
    function switchTab(event, tabId) {
      // 1. Hide all tab panels
      const panels = document.querySelectorAll('.tab-panel');
      panels.forEach(panel => panel.classList.remove('active'));

      // 2. Remove the "active" class from all tab buttons
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      // 3. Show the target tab panel
      document.getElementById(tabId).classList.add('active');

      // 4. Mark the clicked button as active
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
